<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' | ShopEase'">ShopEase</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav class="nav" th:fragment="navbar">
    <a class="brand" th:href="@{/}">🛍️ ShopEase</a>
    <a th:href="@{/}">Products</a>
    <span sec:authorize="isAuthenticated()">
        <a th:href="@{/cart}">Cart<span class="badge" th:if="${cartCount > 0}" th:text="${cartCount}">0</span></a>
    </span>
    <a sec:authorize="isAuthenticated()" th:href="@{/orders}">My Orders</a>
    <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin/products}">Admin: Products</a>
    <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin/orders}">Admin: Orders</a>
    <a sec:authorize="!isAuthenticated()" th:href="@{/login}">Login</a>
    <a sec:authorize="!isAuthenticated()" th:href="@{/register}">Register</a>
    <form sec:authorize="isAuthenticated()" th:action="@{/logout}" method="post">
        <span class="muted" sec:authentication="name">user</span>
        <button class="link" type="submit">Logout</button>
    </form>
</nav>
<div th:fragment="flash" class="container" style="margin-bottom:0">
    <div class="alert ok" th:if="${message}" th:text="${message}"></div>
    <div class="alert err" th:if="${error}" th:text="${error}"></div>
</div>
<footer th:fragment="footer">© 2026 ShopEase · Built with Spring Boot</footer>
</body>
</html>
