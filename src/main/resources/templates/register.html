<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Register')}"></head>
<body>
<nav th:replace="~{fragments :: navbar}"></nav>
<div class="container">
    <div class="panel form">
        <h1>Create account</h1>
        <form th:action="@{/register}" th:object="${user}" method="post">
            <label for="name">Name</label>
            <input id="name" type="text" th:field="*{name}">
            <div class="field-err" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
            <label for="email">Email</label>
            <input id="email" type="email" th:field="*{email}">
            <div class="field-err" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
            <label for="password">Password (min 6 characters)</label>
            <input id="password" type="password" th:field="*{password}">
            <div class="field-err" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
            <button class="btn" type="submit">Register</button>
        </form>
        <p>Already registered? <a th:href="@{/login}">Login</a></p>
    </div>
</div>
<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
