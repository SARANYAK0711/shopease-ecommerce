<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Cart')}"></head>
<body>
<nav th:replace="~{fragments :: navbar}"></nav>
<div th:replace="~{fragments :: flash}"></div>
<div class="container">
    <h1>Your cart</h1>
    <div class="panel" th:if="${#lists.isEmpty(items)}">
        <p>Your cart is empty. <a th:href="@{/}">Continue shopping</a></p>
    </div>
    <div th:unless="${#lists.isEmpty(items)}">
        <table>
            <thead><tr><th>Product</th><th>Price</th><th>Quantity</th><th>Subtotal</th><th></th></tr></thead>
            <tbody>
            <tr th:each="i : ${items}">
                <td><a th:href="@{/products/{id}(id=${i.product.id})}" th:text="${i.product.name}">Name</a></td>
                <td th:text="'₹' + ${#numbers.formatDecimal(i.product.price,1,'COMMA',2,'POINT')}"></td>
                <td>
                    <form th:action="@{/cart/update}" method="post">
                        <input type="hidden" name="itemId" th:value="${i.id}">
                        <input class="qty" type="number" name="quantity" th:value="${i.quantity}" min="0" th:max="${i.product.stock}">
                        <button class="btn small secondary" type="submit">Update</button>
                    </form>
                </td>
                <td th:text="'₹' + ${#numbers.formatDecimal(i.subtotal,1,'COMMA',2,'POINT')}"></td>
                <td>
                    <form th:action="@{/cart/remove}" method="post">
                        <input type="hidden" name="itemId" th:value="${i.id}">
                        <button class="btn small danger" type="submit">Remove</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
        <p class="total">Total: <strong th:text="'₹' + ${#numbers.formatDecimal(total,1,'COMMA',2,'POINT')}"></strong></p>
        <div style="text-align:right">
            <a class="btn secondary" th:href="@{/}">Continue shopping</a>
            <a class="btn" th:href="@{/checkout}">Proceed to checkout</a>
        </div>
    </div>
</div>
<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
