<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Manage Products')}"></head>
<body>
<nav th:replace="~{fragments :: navbar}"></nav>
<div th:replace="~{fragments :: flash}"></div>
<div class="container">
    <div class="row">
        <h1 style="margin:0">Manage products</h1>
        <a class="btn" th:href="@{/admin/products/new}">+ Add product</a>
    </div>
    <table>
        <thead><tr><th>ID</th><th>Name</th><th>Category</th><th>Price</th><th>Stock</th><th></th></tr></thead>
        <tbody>
        <tr th:each="p : ${products}">
            <td th:text="${p.id}"></td>
            <td th:text="${p.name}"></td>
            <td th:text="${p.category}"></td>
            <td th:text="'₹' + ${#numbers.formatDecimal(p.price,1,'COMMA',2,'POINT')}"></td>
            <td th:text="${p.stock}"></td>
            <td>
                <a class="btn small secondary" th:href="@{/admin/products/{id}/edit(id=${p.id})}">Edit</a>
                <form th:action="@{/admin/products/{id}/delete(id=${p.id})}" method="post"
                      onsubmit="return confirm('Delete this product?')">
                    <button class="btn small danger" type="submit">Delete</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</div>
<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
